name: Build AuthPlugin Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. 检出代码 (Checkout)
      uses: actions/checkout@v4

    - name: 2. 确认 Xcode 环境
      run: |
        sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: 3. 编译为 iOS 动态库 (.dylib)
      run: |
        # 获取最新的 iOS SDK 路径
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        
        # 核心修改：添加了 -install_name，确保全能签能正确找到并加载这个库
        xcrun --sdk iphoneos clang -arch arm64 \
          -dynamiclib \
          -fobjc-arc \
          -isysroot "$SDK_PATH" \
          -miphoneos-version-min=12.0 \
          -framework UIKit \
          -framework Foundation \
          -install_name @executable_path/Frameworks/AuthPlugin.dylib \
          AuthPlugin.m \
          -o AuthPlugin.dylib
          
        # 验证一下编译结果
        otool -L AuthPlugin.dylib

    - name: 4. 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: AuthPlugin-Dylib
        path: AuthPlugin.dylib
